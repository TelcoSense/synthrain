[io]
out = outputs ; output directory for single-scenario run
debug = true ; extra debug info in console/log
seed = 0 ; random seed

[network]
city = true ; use compact city bbox preset
city_bbox = 14.2,14.8,49.9,50.2 ; bbox used when city=true
noncity_bbox = 12.0,19.0,48.5,51.2 ; bbox used when city=false
; city_bbox = 14.25,14.75,49.95,50.15 ; tighter city preset
; noncity_bbox = 12.5,18.5,48.7,51.0 ; tighter country preset
; bbox = 12.0,19.0,48.5,51.2 ; explicit override (highest priority over presets)
n_sites = 50 ; number of CML sites
mean_degree = 4 ; average link connectivity
min_length_km = 0.5 ; minimum link length
max_length_km = 20.0 ; maximum link length
site_sampling = poisson ; uniform|poisson
site_min_dist_m = 3000 ; minimum spacing between sites (poisson mode)

[interp]
interp_style = "pycomlink" ; pycomlink|custom
grid_step_m = 1000.0 ; grid resolution in meters
idw_power = 2 ; IDW power p
idw_near = 8 ; max neighbours per grid point
idw_dist_m = 10000 ; neighbour radius in meters (<=0 means unlimited)
dry_as_zero = true ; true: dry links contribute as 0, false: dry links ignored

[rain]
n_blobs = 6 ; number of synthetic rain cells
blob_sigma_m = 6000.0 ; rain cell spread (meters)
peak_mmph = 25.0 ; max rain intensity
background_mmph = 0.0 ; uniform background rainfall
min_rain = 0.1 ; minimum rain threshold for rendering

[wet]
wet_mode = random ; threshold|random|stratified
wet_target = 0.10 ; target wet fraction
wet_strata_nx = 8 ; stratified mode bins in x
wet_strata_ny = 8 ; stratified mode bins in y
flip_dry_to_wet = 0.02 ; random dry->wet label flip probability
flip_wet_to_dry = 0.10 ; random wet->dry label flip probability

[observation]
noise_mmph = 1.0 ; baseline link observation noise
link_path_samples = 9 ; samples taken along each link path

[faults]
outage_fraction = 0.00 ; nonresponding links ignored by interpolation
clustered_outage_fraction = 0.00 ; spatially clustered outages
stuck_zero_fraction = 0.00 ; available links forced to zero
bias_fraction = 0.00 ; multiplicatively biased links
bias_low = 0.85 ; lower multiplicative bias bound
bias_high = 1.15 ; upper multiplicative bias bound
extra_noise_fraction = 0.00 ; links with extra noise on top of baseline noise
extra_noise_mmph = 2.0 ; extra noise sigma for selected links

[csv]
export_csv = true ; export synthetic CSV dataset
csv_steps = 1 ; number of time steps
csv_step_min = 10 ; step size in minutes
csv_start = 2025-12-24 17:00:00 ; start timestamp

[plot]
title_name = IDW from links (mm/h) ; default scenario title for IDW plot

[sweep]
wet_targets = 0.05,0.10,0.20,0.35,0.50 ; default wet sweep targets when CLI omits --wet-targets
